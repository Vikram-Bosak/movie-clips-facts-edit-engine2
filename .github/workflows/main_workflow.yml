name: Movie Clips & Facts Editing Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  run-agents:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_RUN_ID: ${{ github.run_id }}
      GITHUB_SERVER_URL: ${{ github.server_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libsm6 libxext6 wget

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      # Downloader Agent (YouTube)
      - name: Run YouTube Downloader Agent
        run: python agents/downloader_agent.py

      # Video Analysis Agent (7s clip + interesting facts)
      - name: Run Video Analysis Agent
        run: python agents/video_analysis_agent.py

      # Smart Editing Agent (compose Shorts: space bg + clip + facts + profile + reaction)
      - name: Run Smart Editing Agent
        run: python agents/smart_editing_agent.py

      # Upload Agent (Google Drive)
      - name: Run Upload Agent
        env:
          GDRIVE_OAUTH_TOKEN: ${{ secrets.GDRIVE_OAUTH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python agents/upload_agent.py

      # Report Agent
      - name: Run Report Agent
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python agents/report_agent.py

      # Save Memory Database (for debugging)
      - name: Upload Memory SQLite Database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-database
          path: memory.db

      # Save the 7-second Clip
      - name: Upload 7s Clip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seven-second-clip
          path: clips/

      # Save Final Video
      - name: Upload Final Video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: exports/
